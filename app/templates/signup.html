{% extends "base.html" %} {% block content %}
<div>
  <div class="header">
    <div class="header-title">
      <p class="display">Sign Up</p>
    </div>
  </div>

  <div class="card" style="margin: var(--space-8) 0; width: 50%">
    <form method="post">
      <div class="input-group">
        <label for="username" class="label input-label">Username</label>
        <input
          type="username"
          id="username"
          class="input"
          name="username"
          required
        />
      </div>
      <div class="input-group">
        <label for="password" class="label input-label">Password</label>
        <input
          type="password"
          id="password"
          class="input"
          name="password"
          required
        />
      </div>
      <input
        type="submit"
        value="Sign Up"
        class="btn btn-primary motion-up-hover motion-down-active easing-base submit"
      />

      {% if res and msg != 'start' %}
      <p class="label auth" style="color: var(--success)">
        Successfully signed up.
      </p>
      {% elif not res %}
      <p class="label auth" style="color: var(--danger)">{{ msg }}</p>
      {% endif %}
    </form>
    <a href="./login" style="text-align: center">Already a user? Log in</a>
  </div>
</div>
{% endblock %}
